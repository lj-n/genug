name: CI

# Runs on PRs (the merge gate) and on pushes to main. The main runs exist so
# the README status badge reflects main itself rather than the latest PR branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # dorny/paths-filter (in the `gate` job) lists changed files via the API.
  pull-requests: read

concurrency:
  # PR runs supersede each other. Pushes to main get a per-commit group so
  # back-to-back merges never cancel a run — a cancelled run on main would
  # surface as a red README badge.
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

# Runner routing: the CI_RUNNER repo variable overrides the runner label for
# all jobs (e.g. ubicloud-standard-2). Unset it to fall back to GitHub-hosted.

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc min-release-age needs npm >=11.17; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - run: npm run build
        env:
          DATABASE_URL: ':memory:'

  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc min-release-age needs npm >=11.17; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - run: npm run check

  lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc min-release-age needs npm >=11.17; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - run: npm run lint

  unit-test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc min-release-age needs npm >=11.17; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - run: npm run test:unit -- run --coverage
        env:
          DATABASE_URL: ':memory:'

  # Decide whether the (expensive) e2e suite should run for this event.
  # Skips draft PRs and changes that touch only docs/markdown. On pushes to
  # main, paths-filter diffs against the commit before the push.
  gate:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      run_e2e: ${{ steps.decide.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
      - id: decide
        run: |
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Draft PR — skipping e2e."
          elif [ "${{ steps.filter.outputs.code }}" = "true" ]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Code changed — running e2e."
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change — skipping e2e."
          fi

  e2e-test:
    needs: [gate]
    if: needs.gate.outputs.run_e2e == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc min-release-age needs npm >=11.17; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npx paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # Required status check. Always reports a definitive result:
  # pass when e2e succeeded or was intentionally skipped, fail otherwise.
  e2e-success:
    name: 🎉 E2E Tests Passed
    needs: [gate, e2e-test]
    if: always()
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - run: |
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "Gate job did not succeed (${{ needs.gate.result }}) — cannot confirm e2e status."
            exit 1
          fi
          if [ "${{ needs.gate.outputs.run_e2e }}" != "true" ]; then
            echo "E2E skipped (draft or docs-only change)."
            exit 0
          fi
          if [ "${{ needs.e2e-test.result }}" = "success" ]; then
            echo "All e2e shards passed."
            exit 0
          fi
          echo "E2E did not pass: ${{ needs.e2e-test.result }}"
          exit 1

  e2e-merge:
    needs: [gate, e2e-test]
    if: always() && needs.gate.outputs.run_e2e == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # .npmrc min-release-age needs npm >=11.17; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: blob-report/
          merge-multiple: true
      - run: npx playwright merge-reports --reporter=list ./blob-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
