name: Bug report
description: Something in genug-da doesn't work as expected.
labels: ['bug', 'needs-triage']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
      placeholder: When I ..., genug-da ... — I expected ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown next to the logo in the app, e.g. `2026.07.2` or `2026.07.2-dev+a1b2c3d`.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose (release image)
        - Docker Compose (stage image)
        - Docker (standalone)
        - Manual (node build)
        - Other / development
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs around the time of the error, if available. Redact anything private.
      render: shell
